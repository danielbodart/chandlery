# The Nix packages of the games whose files come from our own published images
# (docs/nix.md), built and run for real: Hytale's 1.8 GB and Valheim's 1.9 GB of
# layers fetched from GHCR, unpacked, and each server booted in a NixOS VM
# (`heavyChecks`). Too heavy for every push; and a pin CI pushes to
# nix/versions.json starts no workflow (GITHUB_TOKEN), so this runs on a
# schedule against whatever is pinned, and by hand.
name: nix

on:
  schedule:
    - cron: '11 5 * * 1'
  workflow_dispatch:

concurrency:
  group: nix-heavy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  heavy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [hytale, valheim]
    steps:
      - uses: actions/checkout@v4

      # A game's layers, its unpacked tree and a VM's disk do not fit in the
      # free runner's disk as it comes: drop the toolchains this job never uses.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: The ${{ matrix.game }} package, and its server in a VM
        env:
          GAME: ${{ matrix.game }}
        run: nix build -L ".#heavyChecks.${GAME}-vm"
