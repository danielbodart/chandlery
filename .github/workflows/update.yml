# The weekly update: every dependency of Chandlery's own code and images moves
# once a week, gated, and is committed straight to master. No pull requests.
#
# What moves: the flake's inputs (nixpkgs, on nixos-26.05); each mise tool to
# the newest patch of the minor mise.toml pins (a minor moves by hand, with the
# flake's buildGo1xxModule); mc-monitor, Bedrock's health probe, to itzg's
# latest release in both channels at once (the image's tag and digest in
# images/bedrock/Dockerfile, the Nix package's version and hashes in
# nix/pkgs/mc-monitor.nix); the base images' digests in the Dockerfiles, under
# the tags they name; and the Go modules' requirements. The games do not move
# here: each game's workflow polls its upstream hourly.
#
# Why Sunday 21:23 UTC: nix-config takes its own update at 23:23 on the same
# nixos-26.05, so the tools here are built from the nixpkgs nix-config builds
# them from, and they are in danielbodart.cachix.org when it asks.
#
# The gate is every channel's tests, each on its own runner: ci.yml's
# `mise run check`, the images driven by the tests, `nix flake check` (the
# packages and every VM test, real Bedrock's included), and nix.yml's real
# Hytale and Valheim. Any of them failing commits nothing. The commit lands
# only on a master that has moved by nothing but game pins since the commit it
# checked, so nothing reaches master unchecked against what moved here.
#
# Nothing is released from here: Chandlery's releases are the game images, and
# each game's workflow rebuilds its image on its next hourly run when its inputs
# moved (a base image's digest, the Go that builds the Valheim probe), because
# its "already built?" check is keyed on them (build/image-inputs). A week in
# which only flake.lock moved rebuilds no image.
name: Weekly update

on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Shared with anything else that commits what this moves. The game workflows'
# pins are not in it: they commit only nix/versions.json, which nothing here
# touches, and rebase on whatever won (nix/push-pin).
concurrency:
  group: update

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.update.outputs.moved }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: jdx/mise-action@v5

      - name: Move every dependency
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          moved=()

          # 1. The flake's inputs. No input is one of my own repositories, so
          # there is no release tag to move.
          nix flake update 2>&1 | tee update.log
          while read -r input; do moved+=("$input"); done \
            < <(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2)

          # 2. mise's tools, to the newest patch of their pinned minor.
          while IFS='=' read -r tool old; do
            new=$(mise latest "$tool@${old%.*}")
            if [ -n "$new" ] && [ "$new" != "$old" ]; then
              sed -i "/^\[tools\]/,/^\[/s/^$tool = \"$old\"/$tool = \"$new\"/" mise.toml
              moved+=("$tool $old -> $new")
            fi
          done < <(sed -n '/^\[tools\]/,/^\[/s/^\([A-Za-z0-9_-]*\) *= *"\([0-9.]*\)".*/\1=\2/p' mise.toml)

          # mc-monitor: to itzg's latest release, the image's tag and the
          # Nix package together, so both channels run the same probe. The
          # source and vendor hashes are the ones Nix reports for a fake.
          mcm_old=$(sed -n 's|^ARG MC_MONITOR=itzg/mc-monitor:\([^@]*\)@.*|\1|p' images/bedrock/Dockerfile)
          mcm_new=$(gh api repos/itzg/mc-monitor/releases/latest --jq .tag_name)
          if [ -n "$mcm_old" ] && [ -n "$mcm_new" ] && [ "$mcm_new" != "$mcm_old" ]; then
            digest=$(docker buildx imagetools inspect "itzg/mc-monitor:$mcm_new" --format '{{json .Manifest}}' | jq -r .digest)
            [[ $digest == sha256:* ]] || { echo "itzg/mc-monitor:$mcm_new has no digest: $digest" >&2; exit 1; }
            sed -i "s|^ARG MC_MONITOR=itzg/mc-monitor:.*|ARG MC_MONITOR=itzg/mc-monitor:$mcm_new@$digest|" images/bedrock/Dockerfile
            pkg=nix/pkgs/mc-monitor.nix
            sed -i -e "s|^  version = \".*\";|  version = \"$mcm_new\";|" \
                   -e 's|^    hash = ".*";|    hash = lib.fakeHash;|' "$pkg"
            got() { nix build --no-link ".#$1" 2>&1 | sed -n 's/^ *got: *//p' | head -n 1 || true; }
            hash=$(got mc-monitor.src)
            [[ $hash == sha256-* ]] || { echo "no source hash for mc-monitor $mcm_new" >&2; exit 1; }
            sed -i -e "s|^    hash = lib.fakeHash;|    hash = \"$hash\";|" \
                   -e 's|^  vendorHash = ".*";|  vendorHash = lib.fakeHash;|' "$pkg"
            vendor=$(got mc-monitor.goModules)
            [[ $vendor == sha256-* ]] || { echo "no vendorHash for mc-monitor $mcm_new" >&2; exit 1; }
            sed -i "s|^  vendorHash = lib.fakeHash;|  vendorHash = \"$vendor\";|" "$pkg"
            moved+=("mc-monitor $mcm_old -> $mcm_new")
          fi

          # The base images: each tag's current digest.
          dockerfiles=(images/*/Dockerfile test/fixtures/*/Dockerfile)
          while read -r ref; do
            image=${ref%@*} old=${ref#*@}
            new=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$new" != "$old" ]; then
              sed -i "s|$image@$old|$image@$new|g" "${dockerfiles[@]}"
              moved+=("$image")
            fi
          done < <(grep -hoE '[a-z0-9./_-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' "${dockerfiles[@]}" | sort -u)

          # 3. The Go modules' requirements. All are standard library only
          # today, and the flake builds them with vendorHash = null, so there
          # is no vendorHash to recompute.
          for mod in $(git ls-files '*go.mod'); do
            dir=$(dirname "$mod")
            before=$(cd "$dir" && go list -m all | tail -n +2)
            (cd "$dir" && go get -u ./... && go mod tidy)
            after=$(cd "$dir" && go list -m all | tail -n +2)
            while read -r m; do [ -z "$m" ] || moved+=("${m%% *}"); done \
              < <(comm -13 <(echo "$before") <(echo "$after"))
          done

          # 4.
          if git diff --quiet; then
            echo "Nothing moved."
            exit 0
          fi
          git diff --stat
          git diff --binary > update.patch
          list=$(printf '%s\n' "${moved[@]}" | awk '!seen[$0]++' | paste -sd, - | sed 's/,/, /g')
          echo "moved=${list:-dependencies}" >> "$GITHUB_OUTPUT"

      - if: steps.update.outputs.moved
        uses: actions/upload-artifact@v7
        with:
          name: update
          path: update.patch

  # 5. The gate: ci.yml's jobs and nix.yml's, with what moved.
  check:
    needs: update
    if: needs.update.outputs.moved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: update
      - run: git apply update.patch && rm update.patch
      - uses: jdx/mise-action@v5
      - run: mise run check

  images:
    needs: update
    if: needs.update.outputs.moved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: update
      - run: git apply update.patch && rm update.patch
      - uses: docker/setup-buildx-action@v4
      - uses: jdx/mise-action@v5
      - run: make test-base test-bedrock test-valheim-adapter test-hytale-adapter

  nix:
    needs: update
    if: needs.update.outputs.moved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: update
      - run: git apply update.patch && rm update.patch

      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - run: nix flake check -L

  heavy:
    needs: update
    if: needs.update.outputs.moved
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [hytale, valheim]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: update
      - run: git apply update.patch && rm update.patch

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: The ${{ matrix.game }} package, and its server in a VM
        env:
          GAME: ${{ matrix.game }}
        run: nix build -L ".#heavyChecks.${GAME}-vm"

  commit:
    needs: [update, check, images, nix, heavy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: update
      - run: git apply update.patch && rm update.patch

      # 6. As github-actions[bot], on top of master as it is now, provided it
      # has moved by nothing but game pins since the commit checked above.
      - name: Commit and push
        env:
          MOVED: ${{ needs.update.outputs.moved }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Weekly update: $MOVED"
          for n in 1 2 3 4 5; do
            git fetch -q origin master
            ahead=$(git diff --name-only "$GITHUB_SHA" FETCH_HEAD | grep -vx nix/versions.json || true)
            if [ -n "$ahead" ]; then
              echo "master has moved by more than pins since $GITHUB_SHA, so what moved here was not checked against it:"
              echo "$ahead"
              echo "Run this again."
              exit 1
            fi
            git pull -q --rebase origin master
            if git push -q origin HEAD:master; then
              echo "Pushed $(git rev-parse --short HEAD)."
              exit 0
            fi
            echo "Lost a race to master; again on top of it." >&2
            sleep "$n"
          done
          echo "Gave up after $n attempts." >&2
          exit 75

      # 7. Our own packages, as they now are on master; never a game.
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Push our packages to the cache
        run: nix build --print-out-paths .#chandlery-systemd .#chandlery-a2s .#mc-monitor | cachix push danielbodart
