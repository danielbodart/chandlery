# Every channel's tests: `mise run check` (the Go helpers, the probe, the
# native tools' and pin scripts' shell tests), the images driven by the tests,
# and the flake with its VM tests. Our own packages built here go to
# danielbodart.cachix.org from master; the games never do (docs/nix.md,
# "Redistribution").
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The Valheim fixture copies in the probe `mise run dist` builds.
      - uses: jdx/mise-action@v5

      - name: Skeleton
        run: make test-base

      # Builds against whatever Mojang currently ships, which is also a live
      # check that the version endpoint and the download still work — the two
      # things most likely to break without anyone touching this repository.
      - name: Bedrock
        run: make test-bedrock

      # The adapter only: a full Valheim build is a 1 GB SteamCMD download, and
      # valheim.yml already does that whenever the game or these files change.
      - name: Valheim adapter
        run: make test-valheim-adapter

      # Likewise Hytale: the adapter on a fake server, no downloader token and no
      # 3.3 GB asset download. The authenticated fetch is exercised on a real
      # host (PLAN 7.1).
      - name: Hytale adapter
        run: make test-hytale-adapter

      - if: failure()
        run: docker ps -a

  # The Nix flake (docs/nix.md): the packages, the native tools' Go and shell
  # tests, nix/update-versions and nix/push-pin, and the NixOS VM tests — the
  # units on fakes of all three games, and real Bedrock end to end. The real
  # Hytale and Valheim, gigabytes each, are nix.yml's.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The VM tests want KVM, which ubuntu-latest has but does not open to
      # the runner's user.
      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Pulls only: what is pushed is named below.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: nix flake check
        run: nix flake check -L

      # Our own packages, never a game (unfree, redistributing it is not ours
      # to do) and never a VM test's closure (the cache's 5 GB free tier).
      - name: Push our packages to the cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: nix build --print-out-paths .#chandlery-systemd .#chandlery-a2s .#mc-monitor | cachix push danielbodart

