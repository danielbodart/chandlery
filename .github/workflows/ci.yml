# Build the images and run the tests that drive them.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Skeleton
        run: make test-base

      # Builds against whatever Mojang currently ships, which is also a live
      # check that the version endpoint and the download still work — the two
      # things most likely to break without anyone touching this repository.
      - name: Bedrock
        run: make test-bedrock

      # The adapter only: a full Valheim build is a 1 GB SteamCMD download, and
      # valheim.yml already does that whenever the game or these files change.
      - name: Valheim adapter
        run: make test-valheim-adapter

      # Likewise Hytale: the adapter on a fake server, no downloader token and no
      # 3.3 GB asset download. The authenticated fetch is exercised on a real
      # host (PLAN 7.1).
      - name: Hytale adapter
        run: make test-hytale-adapter

      - if: failure()
        run: docker ps -a

  # The Nix flake (docs/nix.md): the packages, the native tools' Go and shell
  # tests, nix/update-versions and nix/push-pin, and the NixOS VM tests — the
  # units on fakes of all three games, and real Bedrock end to end. The real
  # Hytale and Valheim, gigabytes each, are nix.yml's.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The VM tests want KVM, which ubuntu-latest has but does not open to
      # the runner's user.
      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: nix flake check
        run: nix flake check -L

