# Rebuild Bedrock when Mojang ships a new version.
#
# The whole "image = version" idea rests on this: nothing downloads the game at
# container start, so a release only reaches the fleet if CI notices it and
# bakes a new image. Tidewaiter takes it from there, when the server is idle.
name: bedrock

on:
  schedule:
    # Hourly. Mojang does not announce releases, so polling is the only option.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build this exact version instead of whatever is current'
        required: false
      force:
        description: 'Rebuild even if this version was already built from these inputs'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'images/base/**'
      - 'build/**'
      - 'images/bedrock/**'
      - '.github/workflows/bedrock.yml'

concurrency:
  group: bedrock
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/bedrock

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      sha256: ${{ steps.upstream.outputs.sha256 }}
      needed: ${{ steps.built.outputs.needed }}
      inputs: ${{ steps.built.outputs.inputs }}
    steps:
      - uses: actions/checkout@v7

      - id: upstream
        name: Ask Mojang what it currently ships
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          [ -n "$version" ] || version="$(./images/bedrock/upstream-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Upstream Bedrock: $version"

          # Download once here to record the checksum, and hand it to the build
          # so it can confirm it received the same bytes. This catches a CDN
          # that flaps or truncates mid-build; it is not a signature, because
          # Mojang does not publish one.
          url="https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-${version}.zip"
          # Mojang's Azure CDN kills the HTTP/2 stream for a User-Agent it does
          # not like (curl's default, or one with spaces/parens); a plain token
          # UA gets a clean 200. Same fix the runtime fetch uses.
          # itzg/docker-minecraft-bedrock-server#458.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --retry-max-time 300 \
               -A chandlery/bedrock -o bds.zip "$url"
          sha="$(sha256sum bds.zip | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "sha256: $sha"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: built
        name: Skip when this game version is already built from these inputs
        env:
          FORCE: ${{ inputs.force }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          # Already built when the published :<version> carries the hash of
          # this repo's inputs to the image (build/image-inputs): a new game
          # version or a change to those inputs builds, and nothing else does —
          # not a new commit alone, such as a pin in nix/versions.json.
          inputs="$(build/image-inputs bedrock)"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          published="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{ index .Image.Config.Labels "dev.chandlery.inputs" }}' 2>/dev/null || true)"
          if [ "$FORCE" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Building: forced."
          elif [ "$published" = "$inputs" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${VERSION} is already built from inputs ${inputs}; nothing changed."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Building ${VERSION} from inputs ${inputs} (published: ${published:-none})."
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-latest
    # contents: write for the pin in nix/versions.json, pushed to master.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Plain daemon build: the game's `FROM chandlery/base:ci` resolves the base
      # built a line earlier in the same daemon — no registry pull, no shared
      # store. SOURCE_DATE_EPOCH is fixed so unchanged asset buckets dedupe
      # across versions (images/bedrock/Dockerfile).
      - name: Build and push Bedrock
        env:
          DOCKER_BUILDKIT: "1"
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA256: ${{ needs.resolve.outputs.sha256 }}
          INPUTS: ${{ needs.resolve.outputs.inputs }}
        run: |
          docker build -t chandlery/base:ci images/base
          rev="${GITHUB_SHA::7}"
          # BDS is x86-64 only; there is no ARM server build to fall back to.
          # Three tags: the moving game version, the immutable <version>-<rev>,
          # and latest. The full SHA is the revision label.
          docker build \
            --build-arg BASE=chandlery/base:ci \
            --build-arg BEDROCK_VERSION="$VERSION" \
            --build-arg BEDROCK_SHA256="$SHA256" \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --build-arg CHANDLERY_REVISION="$GITHUB_SHA" \
            --label dev.chandlery.inputs="$INPUTS" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${VERSION}-${rev}" \
            -t "${IMAGE}:latest" -f images/bedrock/Dockerfile .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${VERSION}-${rev}"
          docker push "${IMAGE}:latest"

      - name: Say what shipped
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA256: ${{ needs.resolve.outputs.sha256 }}
        run: |
          {
            echo "### Bedrock ${VERSION}"
            echo ""
            echo "- \`${IMAGE}:${VERSION}\`"
            echo "- zip sha256 \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The Nix package (docs/nix.md) builds what nix/versions.json pins: pin
      # the zip this image was just built from, by the same sha256, so the image
      # and the native package move together. Only from master, whose image
      # this is. An image rebuilt only for our own code has the same zip, so
      # this pushes nothing; and no pin could start a rebuild anyway, as the
      # check above is keyed on the version and the image's inputs, never on
      # the commit.
      - name: Pin it in nix/versions.json
        if: github.ref == 'refs/heads/master'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA256: ${{ needs.resolve.outputs.sha256 }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          nix/push-pin bedrock "$VERSION" "$SHA256"
