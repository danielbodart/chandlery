# Rebuild Bedrock when Mojang ships a new version.
#
# The whole "image = version" idea rests on this: nothing downloads the game at
# container start, so a release only reaches the fleet if CI notices it and
# bakes a new image. Tidewaiter takes it from there, when the server is idle.
name: bedrock

on:
  schedule:
    # Hourly. Mojang does not announce releases, so polling is the only option.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build this exact version instead of whatever is current'
        required: false
      force:
        description: 'Rebuild even if the tag already exists'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'base/**'
      - 'bedrock/**'
      - '.github/workflows/bedrock.yml'

concurrency:
  group: bedrock
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/bedrock

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      sha256: ${{ steps.upstream.outputs.sha256 }}
      needed: ${{ steps.built.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      - id: upstream
        name: Ask Mojang what it currently ships
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="$(./bedrock/upstream-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Upstream Bedrock: $version"

          # Download once here to record the checksum, and hand it to the build
          # so it can confirm it received the same bytes. This catches a CDN
          # that flaps or truncates mid-build; it is not a signature, because
          # Mojang does not publish one.
          url="https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-${version}.zip"
          # Mojang's Azure CDN kills the HTTP/2 stream for a User-Agent it does
          # not like (curl's default, or one with spaces/parens); a plain token
          # UA gets a clean 200. Same fix the runtime fetch uses.
          # itzg/docker-minecraft-bedrock-server#458.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --retry-max-time 300 \
               -A chandlery/bedrock -o bds.zip "$url"
          sha="$(sha256sum bds.zip | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "sha256: $sha"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: built
        name: Skip versions already published
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Building regardless: forced, or the image definition changed."
          elif docker buildx imagetools inspect "${IMAGE}:${{ steps.upstream.outputs.version }}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ steps.upstream.outputs.version }} already exists; nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "New version. Building."
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Plain daemon build: the game's `FROM chandlery/base:ci` resolves the base
      # built a line earlier in the same daemon — no registry pull, no shared
      # store. SOURCE_DATE_EPOCH is fixed so unchanged asset buckets dedupe
      # across versions (bedrock/Dockerfile).
      - name: Build and push Bedrock
        env:
          DOCKER_BUILDKIT: "1"
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA256: ${{ needs.resolve.outputs.sha256 }}
        run: |
          docker build -t chandlery/base:ci base
          # BDS is x86-64 only; there is no ARM server build to fall back to.
          docker build \
            --build-arg BASE=chandlery/base:ci \
            --build-arg BEDROCK_VERSION="$VERSION" \
            --build-arg BEDROCK_SHA256="$SHA256" \
            --build-arg SOURCE_DATE_EPOCH=0 \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" -f bedrock/Dockerfile .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      - name: Say what shipped
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA256: ${{ needs.resolve.outputs.sha256 }}
        run: |
          {
            echo "### Bedrock ${VERSION}"
            echo ""
            echo "- \`${IMAGE}:${VERSION}\`"
            echo "- zip sha256 \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
