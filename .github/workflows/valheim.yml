# Rebuild Valheim when Steam publishes a new build of the dedicated server.
#
# Steam only knows the build id; the human-facing version (e.g. 0.221.12) is a
# code constant with no cheap source, so the tag is the *game version* — read by
# actually downloading and booting the server once here. The build id and the
# immutable manifest gid ride along as labels: the gid is what addresses the
# exact bytes, and recording it on every build is what keeps old images
# re-creatable for rollback (PLAN 7.3).
#
# The download is authenticated (anonymous cannot fetch this depot), so this
# needs the licensed account's DepotDownloader token and username as secrets.
name: valheim

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build this exact build id instead of whatever is current'
        required: false
      force:
        description: 'Rebuild even if this build id was already built from these inputs'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'images/base/**'
      - 'build/**'
      - 'images/valheim/**'
      - '.github/workflows/valheim.yml'
      - 'mise.toml'

concurrency:
  group: valheim
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/valheim

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.upstream.outputs.build_id }}
      manifest_gid: ${{ steps.upstream.outputs.manifest_gid }}
      needed: ${{ steps.built.outputs.needed }}
      inputs: ${{ steps.built.outputs.inputs }}
    steps:
      - uses: actions/checkout@v7

      - id: upstream
        name: Ask Steam what the public branch is on
        env:
          BUILD_ID_INPUT: ${{ inputs.build_id }}
        run: |
          build_id="$BUILD_ID_INPUT"
          [ -n "$build_id" ] || build_id="$(./images/valheim/upstream-version)"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "Upstream Valheim build: $build_id"
          # The gid is only ever the *current* one here, so record it on every
          # build or an old image can never be recreated (PLAN 7.3).
          manifest_gid="$(./images/valheim/upstream-version --gid)"
          echo "manifest_gid=$manifest_gid" >> "$GITHUB_OUTPUT"
          echo "Manifest gid: $manifest_gid"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: built
        name: Skip when this game build is already built from these inputs
        env:
          FORCE: ${{ inputs.force }}
          BUILD_ID: ${{ steps.upstream.outputs.build_id }}
        run: |
          # The tag is the game version, which we do not know without downloading,
          # so the "already built?" check reads two labels off the published
          # :latest — the Steam build id (the game) and the hash of this repo's
          # inputs to the image (build/image-inputs). Both matching means nothing
          # changed; a new game build or a change to those inputs rebuilds, and
          # nothing else does — not a new commit alone, such as a pin in
          # nix/versions.json.
          inputs="$(build/image-inputs valheim)"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Building: forced."
          else
            meta=$(docker buildx imagetools inspect "${IMAGE}:latest" \
              --format '{{ index .Image.Config.Labels "dev.chandlery.valheim.build-id" }} {{ index .Image.Config.Labels "dev.chandlery.inputs" }}' 2>/dev/null || echo "")
            pub_build="${meta%% *}"; pub_inputs="${meta##* }"
            if [ "$pub_build" = "$BUILD_ID" ] && [ "$pub_inputs" = "$inputs" ]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "Build ${BUILD_ID} is already built from inputs ${inputs}; nothing changed."
            else
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "Building ${BUILD_ID} from inputs ${inputs} (published: build ${pub_build:-none}, inputs ${pub_inputs:-none})."
            fi
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-latest
    # contents: write for the pin in nix/versions.json, pushed to master.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The health probe the image copies in: dist/linux-amd64/chandlery-a2s.
      - uses: jdx/mise-action@v5
      - run: mise run dist

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image bakes the game, so the fetch runs at BUILD: STEAM_USERNAME is a
      # build-arg, and STEAM_LOGIN_TOKEN (base64 of the DepotDownloader
      # account.config) is decoded to a file and mounted as the steam-token build
      # secret — neither rides into the image.
      #
      # The game is built ONCE. Its human version (e.g. 0.221.12) is only knowable
      # by booting the server, and it is baked into nothing but the OCI version
      # label — so rather than rebuild the whole image to set it, we boot the built
      # image, read the version, and stamp it onto the built image in one trivial
      # metadata layer (FROM <built> + LABEL/ENV). That is the tag-and-label step,
      # done once, after we actually have the version.
      - name: Build, read the version, and push Valheim
        id: build
        env:
          DOCKER_BUILDKIT: "1"
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          MANIFEST_GID: ${{ needs.resolve.outputs.manifest_gid }}
          INPUTS: ${{ needs.resolve.outputs.inputs }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_LOGIN_TOKEN: ${{ secrets.STEAM_LOGIN_TOKEN }}
        run: |
          set -euo pipefail
          # The account.config token, owner-only, never on a command line.
          umask 077
          printf '%s' "$STEAM_LOGIN_TOKEN" | base64 -d > "$RUNNER_TEMP/steam-token"

          docker build -t chandlery/base:ci images/base
          # The server is an x86-64 build; there is no ARM one. VALHEIM_VERSION is
          # left at its default — we do not know it yet, and it is not a pin.
          docker build \
            --build-arg BASE=chandlery/base:ci \
            --build-arg VALHEIM_BUILD_ID="$BUILD_ID" \
            --build-arg VALHEIM_MANIFEST_GID="$MANIFEST_GID" \
            --build-arg STEAM_USERNAME="$STEAM_USERNAME" \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --build-arg CHANDLERY_REVISION="$GITHUB_SHA" \
            --label dev.chandlery.inputs="$INPUTS" \
            --secret id=steam-token,src="$RUNNER_TEMP/steam-token" \
            -t valheim:built -f images/valheim/Dockerfile .
          rm -f "$RUNNER_TEMP/steam-token"

          echo "Running the built server to read the game version..."
          cid=$(docker run -d -e VALHEIM_PASSWORD=chandleryci valheim:built)
          version=""
          for _ in $(seq 1 60); do
            sleep 10
            line=$(docker logs "$cid" 2>&1 | grep -oE 'Valheim version: l-[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            if [ -n "$line" ]; then version="${line##*l-}"; break; fi
            docker ps -q --no-trunc | grep -q "$cid" || { echo "server exited early:"; docker logs "$cid" 2>&1 | tail -30; exit 1; }
          done
          docker rm -f "$cid" >/dev/null 2>&1 || true
          [ -n "$version" ] || { echo "could not read the Valheim version"; exit 1; }
          echo "Game version: $version"

          # Stamp the version onto the built image in one metadata layer, and tag
          # it. No re-fetch, no re-copy — this is the whole "set the version once,
          # after we have it" step. The Dockerfile is fed on stdin (no context).
          # The revision label rode in from the main build, so it is inherited.
          # Three tags: moving game version, immutable <version>-<rev>, latest.
          rev="${GITHUB_SHA::7}"
          printf 'FROM valheim:built\nENV VALHEIM_VERSION=%s\nLABEL org.opencontainers.image.version=%s\n' \
            "$version" "$version" \
            | docker build -t "${IMAGE}:${version}" -t "${IMAGE}:${version}-${rev}" -t "${IMAGE}:latest" -

          # Push :latest last so the registry's default view lands on it.
          docker push "${IMAGE}:${version}"
          docker push "${IMAGE}:${version}-${rev}"
          docker push "${IMAGE}:latest"
          # What the Nix package pins: the image just pushed, by its digest.
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${version}")" >> "$GITHUB_OUTPUT"

          {
            echo "### Valheim ${version}-${rev}"
            echo ""
            echo "- \`${IMAGE}:${version}-${rev}\`  (build ${BUILD_ID})"
            echo "- depot 896661 manifest gid \`${MANIFEST_GID}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The Nix package (docs/nix.md) takes the game from this image's layers:
      # pin the image just pushed, by digest, in nix/versions.json, with the
      # Steam build id and manifest gid it was built from. Only from master,
      # whose image this is. The rebuilt image's layers are not byte-for-byte
      # reproducible, so even a rebuild for our own code re-pins; that commit
      # cannot start a rebuild, because the check above is keyed on the build
      # id and the image's inputs, which a pin does not touch, and never on
      # the commit.
      - name: Pin it in nix/versions.json
        if: github.ref == 'refs/heads/master'
        env:
          VERSION: ${{ steps.build.outputs.version }}
          REF: ${{ steps.build.outputs.ref }}
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          MANIFEST_GID: ${{ needs.resolve.outputs.manifest_gid }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          nix/push-pin oci valheim "$REF" "$VERSION" buildId="$BUILD_ID" manifestGid="$MANIFEST_GID"
