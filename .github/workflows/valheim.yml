# Rebuild Valheim when Steam publishes a new build of the dedicated server.
#
# Steam has no version string for a dedicated server, so the tag is the public
# branch's build id, and "has upstream moved" means "has that number changed".
name: valheim

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build this exact build id instead of whatever is current'
        required: false
      force:
        description: 'Rebuild even if the tag already exists'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'base/**'
      - 'valheim/**'
      - '.github/workflows/valheim.yml'

concurrency:
  group: valheim
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/valheim

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.upstream.outputs.build_id }}
      manifest_gid: ${{ steps.upstream.outputs.manifest_gid }}
      needed: ${{ steps.built.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      - id: upstream
        name: Ask Steam what the public branch is on
        run: |
          build_id="${{ inputs.build_id }}"
          [ -n "$build_id" ] || build_id="$(./valheim/upstream-version)"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "Upstream Valheim build: $build_id"

          # The gid is the content address the image actually pins, and it is
          # only ever the *current* one here — so record it now, on every build,
          # or an old image can never be recreated (PLAN 7.3).
          manifest_gid="$(./valheim/upstream-version --gid)"
          echo "manifest_gid=$manifest_gid" >> "$GITHUB_OUTPUT"
          echo "Manifest gid: $manifest_gid"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: built
        name: Skip builds already published
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Building regardless: forced, or the image definition changed."
          elif docker buildx imagetools inspect "${IMAGE}:${{ steps.upstream.outputs.build_id }}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ steps.upstream.outputs.build_id }} already exists; nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "New build. Building."
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR only, and public; plain daemon build, not buildx — see bedrock.yml
      # for both. The image is thin (SteamCMD fetches the game at runtime), so
      # `FROM chandlery/base:ci` just resolves the base built a line earlier.
      - name: Build and push Valheim
        env:
          DOCKER_BUILDKIT: "1"
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          MANIFEST_GID: ${{ needs.resolve.outputs.manifest_gid }}
        run: |
          docker build -t chandlery/base:ci base
          # The server is an x86-64 build; SteamCMD offers no ARM one.
          docker build \
            --build-arg BASE=chandlery/base:ci \
            --build-arg VALHEIM_BUILD_ID="$BUILD_ID" \
            --build-arg VALHEIM_MANIFEST_GID="$MANIFEST_GID" \
            -t "${IMAGE}:${BUILD_ID}" -t "${IMAGE}:latest" valheim
          docker push "${IMAGE}:${BUILD_ID}"
          docker push "${IMAGE}:latest"

      - name: Say what shipped
        env:
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          MANIFEST_GID: ${{ needs.resolve.outputs.manifest_gid }}
        run: |
          {
            echo "### Valheim build ${BUILD_ID}"
            echo ""
            echo "- \`${IMAGE}:${BUILD_ID}\`"
            # The gid is what makes this build re-creatable; keep it in the record.
            echo "- depot 896661 manifest gid \`${MANIFEST_GID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
