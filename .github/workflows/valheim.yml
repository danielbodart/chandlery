# Rebuild Valheim when Steam publishes a new build of the dedicated server.
#
# Steam only knows the build id; the human-facing version (e.g. 0.221.12) is a
# code constant with no cheap source, so the tag is the *game version* — read by
# actually downloading and booting the server once here. The build id and the
# immutable manifest gid ride along as labels: the gid is what addresses the
# exact bytes, and recording it on every build is what keeps old images
# re-creatable for rollback (PLAN 7.3).
#
# The download is authenticated (anonymous cannot fetch this depot), so this
# needs the licensed account's DepotDownloader token and username as secrets.
name: valheim

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build this exact build id instead of whatever is current'
        required: false
      force:
        description: 'Rebuild even if this build id was already published'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'base/**'
      - 'valheim/**'
      - '.github/workflows/valheim.yml'

concurrency:
  group: valheim
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/valheim

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.upstream.outputs.build_id }}
      manifest_gid: ${{ steps.upstream.outputs.manifest_gid }}
      needed: ${{ steps.built.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      - id: upstream
        name: Ask Steam what the public branch is on
        env:
          BUILD_ID_INPUT: ${{ inputs.build_id }}
        run: |
          build_id="$BUILD_ID_INPUT"
          [ -n "$build_id" ] || build_id="$(./valheim/upstream-version)"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "Upstream Valheim build: $build_id"
          # The gid is only ever the *current* one here, so record it on every
          # build or an old image can never be recreated (PLAN 7.3).
          manifest_gid="$(./valheim/upstream-version --gid)"
          echo "manifest_gid=$manifest_gid" >> "$GITHUB_OUTPUT"
          echo "Manifest gid: $manifest_gid"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: built
        name: Skip builds already published
        env:
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          BUILD_ID: ${{ steps.upstream.outputs.build_id }}
        run: |
          # The tag is the game version, which we do not know without downloading.
          # So the "already built?" check reads the build id we recorded as a label
          # on the published :latest — no extra marker tag needed.
          if [ "$FORCE" = "true" ] || [ "$EVENT" = "push" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Building regardless: forced, or the image definition changed."
          else
            published=$(docker buildx imagetools inspect "${IMAGE}:latest" \
              --format '{{ index .Image.Config.Labels "dev.chandlery.valheim.build-id" }}' 2>/dev/null || echo "")
            if [ "$published" = "$BUILD_ID" ]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "build ${BUILD_ID} already published (latest's build-id label); nothing to do."
            else
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "New build (${published:-none} -> ${BUILD_ID}). Building."
            fi
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image bakes the game, so the fetch runs at BUILD: STEAM_USERNAME is a
      # build-arg, and STEAM_LOGIN_TOKEN (base64 of the DepotDownloader
      # account.config) is decoded to a file and mounted as the steam-token build
      # secret — neither rides into the image.
      #
      # The game is built ONCE. Its human version (e.g. 0.221.12) is only knowable
      # by booting the server, and it is baked into nothing but the OCI version
      # label — so rather than rebuild the whole image to set it, we boot the built
      # image, read the version, and stamp it onto the built image in one trivial
      # metadata layer (FROM <built> + LABEL/ENV). That is the tag-and-label step,
      # done once, after we actually have the version.
      - name: Build, read the version, and push Valheim
        env:
          DOCKER_BUILDKIT: "1"
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          MANIFEST_GID: ${{ needs.resolve.outputs.manifest_gid }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_LOGIN_TOKEN: ${{ secrets.STEAM_LOGIN_TOKEN }}
        run: |
          set -euo pipefail
          # The account.config token, owner-only, never on a command line.
          umask 077
          printf '%s' "$STEAM_LOGIN_TOKEN" | base64 -d > "$RUNNER_TEMP/steam-token"

          docker build -t chandlery/base:ci base
          # The server is an x86-64 build; there is no ARM one. VALHEIM_VERSION is
          # left at its default — we do not know it yet, and it is not a pin.
          docker build \
            --build-arg BASE=chandlery/base:ci \
            --build-arg VALHEIM_BUILD_ID="$BUILD_ID" \
            --build-arg VALHEIM_MANIFEST_GID="$MANIFEST_GID" \
            --build-arg STEAM_USERNAME="$STEAM_USERNAME" \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --secret id=steam-token,src="$RUNNER_TEMP/steam-token" \
            -t valheim:built valheim
          rm -f "$RUNNER_TEMP/steam-token"

          echo "Running the built server to read the game version..."
          cid=$(docker run -d -e VALHEIM_PASSWORD=chandleryci valheim:built)
          version=""
          for _ in $(seq 1 60); do
            sleep 10
            line=$(docker logs "$cid" 2>&1 | grep -oE 'Valheim version: l-[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            if [ -n "$line" ]; then version="${line##*l-}"; break; fi
            docker ps -q --no-trunc | grep -q "$cid" || { echo "server exited early:"; docker logs "$cid" 2>&1 | tail -30; exit 1; }
          done
          docker rm -f "$cid" >/dev/null 2>&1 || true
          [ -n "$version" ] || { echo "could not read the Valheim version"; exit 1; }
          echo "Game version: $version"

          # Stamp the version onto the built image in one metadata layer, and tag
          # it. No re-fetch, no re-copy — this is the whole "set the version once,
          # after we have it" step. The Dockerfile is fed on stdin (no context).
          printf 'FROM valheim:built\nENV VALHEIM_VERSION=%s\nLABEL org.opencontainers.image.version=%s\n' \
            "$version" "$version" \
            | docker build -t "${IMAGE}:${version}" -t "${IMAGE}:latest" -

          # Push :latest last so the registry's default view lands on it.
          docker push "${IMAGE}:${version}"
          docker push "${IMAGE}:latest"

          {
            echo "### Valheim ${version}"
            echo ""
            echo "- \`${IMAGE}:${version}\`  (build ${BUILD_ID})"
            echo "- depot 896661 manifest gid \`${MANIFEST_GID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
