# The lock takes the newest of each input once a week, in the window every
# one of my flakes shares: Sunday 21:23 UTC, two hours before nix-config
# takes its own. So a fix reaches every repository within the week, and they
# all land on the same nixpkgs revisions.
#
# nix-config takes master within the hour, so the new lock is held to all
# of the Nix CI there is before anything is committed: ci.yml's
# `nix flake check` (the packages, the tools' tests and every VM test, real
# Bedrock's included) and nix.yml's real Hytale and Valheim, each on its own
# runner, as nix.yml needs the disk. One lock is resolved first and every
# check builds that one, so what is committed is what was checked. Any of
# them failing commits nothing, and master keeps the lock it had. Only
# flake.lock is committed, named by the inputs that moved. The Docker images
# take nothing from the flake, so ci.yml's test job has nothing to say here.
#
# The game workflows push their pins to nix/versions.json meanwhile, each in
# its own concurrency group, by nix/push-pin, which re-applies the pin on top
# of whatever won a race. This does the same with the lock, which no pin
# touches, so neither waits for the other; but it lands only on a master
# that has moved by nothing but pins since the commit it checked, so new
# code never reaches master with a lock it was not checked against.
name: Bump flake.lock

on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# This is the only workflow that writes flake.lock.
concurrency:
  group: flake-lock

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.update.outputs.moved }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Update every input
        id: update
        run: |
          nix flake update 2>&1 | tee update.log
          if git diff --quiet flake.lock; then
            echo "Nothing moved."
          else
            moved=$(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2 | paste -sd, - | sed 's/,/, /g')
            echo "moved=${moved:-flake.lock}" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.update.outputs.moved
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock

  # ci.yml's nix job, with the new lock.
  check:
    needs: update
    if: needs.update.outputs.moved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flake-lock

      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Read-only: the cache is public and the games are unfree, so nothing
      # built here is pushed to it (docs/nix.md, "Redistribution").
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: nix flake check
        run: nix flake check -L

  # nix.yml's, with the new lock.
  heavy:
    needs: update
    if: needs.update.outputs.moved
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [hytale, valheim]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flake-lock

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Read-only, as above.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: The ${{ matrix.game }} package, and its server in a VM
        env:
          GAME: ${{ matrix.game }}
        run: nix build -L ".#heavyChecks.${GAME}-vm"

  commit:
    needs: [update, check, heavy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flake-lock

      - name: Commit and push the lock
        env:
          MOVED: ${{ needs.update.outputs.moved }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Bump flake.lock: $MOVED" flake.lock
          checked=$(git rev-parse HEAD)
          for n in 1 2 3 4 5; do
            git fetch -q origin master
            moved=$(git diff --name-only "$GITHUB_SHA" FETCH_HEAD | grep -vx nix/versions.json || true)
            if [ -n "$moved" ]; then
              echo "master has moved by more than pins since $GITHUB_SHA, so the lock was not checked against it:"
              echo "$moved"
              echo "Run this again."
              exit 1
            fi
            git reset -q --hard "$checked"
            git rebase -q FETCH_HEAD
            if git push -q origin HEAD:master; then
              echo "Pushed $(git rev-parse --short HEAD)."
              exit 0
            fi
            echo "Lost a race to master; again on top of it." >&2
            sleep "$n"
          done
          echo "Gave up after $n attempts." >&2
          exit 75
