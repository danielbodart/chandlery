# Rebuild Hytale when Hypixel ships a new version.
#
# Unlike Bedrock and Valheim, detecting a Hytale release is authenticated: the
# version manifest is behind OAuth (PLAN 7.1). So this mints a downloader access
# token from the stored refresh token — which rotates on every use, each refresh
# killing the previous one. The rotated token is written straight back to the
# secret, before anything else can fail and lose it. A GitHub App provides the
# Secrets:write credential (its private key never expires, so nothing here has to
# be rotated by hand); GITHUB_TOKEN cannot write secrets.
name: hytale

on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build this exact version instead of detecting'
        required: false
      force:
        description: 'Rebuild even if the tag already exists'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'base/**'
      - 'build/**'
      - 'hytale/**'
      - '.github/workflows/hytale.yml'

# Never two at once: the refresh-token rotation is a read-modify-write on one
# secret, and a second run would race it and lose a token.
concurrency:
  group: hytale
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/hytale
  HYTALE_PATCHLINE: release

jobs:
  # One job, because the baked build needs the access token as a build secret and
  # a bearer credential must not travel between jobs (nor become a step output).
  # Mint (and rotate) the token, resolve the version, skip if already built, then
  # bake and push — all with the access token in scope.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.HYTALE_APP_ID }}
          private-key: ${{ secrets.HYTALE_APP_PRIVATE_KEY }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rotate the token, resolve the version, bake and push
        env:
          DOCKER_BUILDKIT: "1"
          HYTALE_DOWNLOADER_REFRESH_TOKEN: ${{ secrets.HYTALE_DOWNLOADER_REFRESH_TOKEN }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION_INPUT: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          umask 077

          # Mint the access token; rotate the refresh token back into the secret
          # FIRST, before any step that could fail, or an interrupted run locks
          # the pipeline out.
          export HYTALE_REFRESH_WRITEBACK="$RUNNER_TEMP/newrt"
          access="$(tools/hytale-token)"
          # The access token is minted, not a registered secret, so GitHub does
          # not auto-mask it. Register it now, before any step (the docker build
          # included) could echo it, so it is redacted everywhere in the log.
          echo "::add-mask::$access"
          if [ -s "$HYTALE_REFRESH_WRITEBACK" ]; then
            gh secret set HYTALE_DOWNLOADER_REFRESH_TOKEN --repo "$REPO" < "$HYTALE_REFRESH_WRITEBACK"
            echo "rotated refresh token written back to the secret"
          else
            echo "no rotation this run"
          fi
          export HYTALE_ACCESS_TOKEN="$access"

          version="$VERSION_INPUT"
          [ -n "$version" ] || version="$(./hytale/upstream-version)"
          sha="$(./hytale/upstream-version --sha256)"
          echo "Hytale $HYTALE_PATCHLINE is on $version (sha256 $sha)"

          if [ "$FORCE" != "true" ] && [ "$EVENT" != "push" ] \
             && docker buildx imagetools inspect "${IMAGE}:${version}" >/dev/null 2>&1; then
            echo "${IMAGE}:${version} already exists; nothing to do."
            exit 0
          fi

          # The access token to a file, owner-only, for the build secret — never
          # baked, never on a command line.
          printf '%s' "$access" > "$RUNNER_TEMP/hytale-token"

          docker build -t chandlery/base:ci base
          docker build \
            --build-arg BASE=chandlery/base:ci \
            --build-arg HYTALE_VERSION="$version" \
            --build-arg HYTALE_PATCHLINE="$HYTALE_PATCHLINE" \
            --build-arg HYTALE_SHA256="$sha" \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --secret id=hytale-token,src="$RUNNER_TEMP/hytale-token" \
            -t "${IMAGE}:${version}" -t "${IMAGE}:latest" -f hytale/Dockerfile .
          rm -f "$RUNNER_TEMP/hytale-token"

          docker push "${IMAGE}:${version}"
          docker push "${IMAGE}:latest"

          {
            echo "### Hytale ${version}"
            echo ""
            echo "- \`${IMAGE}:${version}\`"
            echo "- build sha256 \`${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
