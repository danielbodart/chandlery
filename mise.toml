# The toolchain for Chandlery's own code (systemd/, the Valheim A2S probe),
# pinned. Go's minor is the flake's (buildGo127Module, nixos-26.05's go_1_27),
# so both channels build with the same language version; the weekly update
# moves the patch, a minor moves by hand with the flake.
[tools]
go = "1.27.3"

# The dev loop and CI's fast job: vet, format and tests of the Go helpers and
# the probe, the test fixtures' fake servers, and the shell tests of the
# native tools and the pin scripts.
# No Docker and no Nix: `make test` drives the images, `nix flake check` the
# packages and VM tests.
[tasks.check]
description = "Fast lint and tests: Go helpers, the A2S probe, the test fixtures, the native tools' and pin scripts' shell tests"
depends = ["check:systemd", "check:probe", "check:fixtures", "check:scripts"]

[tasks."check:systemd"]
dir = "systemd"
run = ['test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }', "go vet ./...", "go test ./..."]

[tasks."check:probe"]
dir = "images/valheim/probe"
run = ['test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }', "go vet ./...", "go test ./..."]

[tasks."check:fixtures"]
run = [
  'cd test/fixtures/fake-valheim && test -z "$(gofmt -l .)" && go vet ./...',
  'cd test/fixtures/raknet-pong && test -z "$(gofmt -l .)" && go vet ./...',
]

[tasks."check:scripts"]
run = ["sh test/systemd_test.sh", "sh test/versions_test.sh"]

# The helpers for the host, into bin/.
[tasks.build]
description = "Build the Go helpers and the A2S probe for the host, into bin/"
run = [
  "cd systemd && CGO_ENABLED=0 go build -trimpath -o ../bin/ ./cmd/...",
  "cd images/valheim/probe && CGO_ENABLED=0 go build -trimpath -o ../../../bin/chandlery-a2s .",
]

# What the images take of our own code: the Valheim image's health probe,
# built here rather than in a Go image (the servers are x86-64 only). Its
# tests run first, as they did when the image compiled it.
[tasks.dist]
description = "The binaries the game images copy in, into dist/linux-amd64/"
depends = ["check:probe"]
dir = "images/valheim/probe"
env = { CGO_ENABLED = "0", GOOS = "linux", GOARCH = "amd64" }
run = "go build -trimpath -o ../../../dist/linux-amd64/chandlery-a2s ."

# The test fixtures' fake servers (fake Valheim, the RakNet pong) that the
# image tests copy in, built here rather than in a Go image, into
# test/fixtures/bin/linux-amd64/. Not shipped: only the tests use them.
[tasks.fixtures]
description = "The test fixtures' fake servers the image tests copy in, into test/fixtures/bin/linux-amd64/"
env = { CGO_ENABLED = "0", GOOS = "linux", GOARCH = "amd64" }
run = [
  "cd test/fixtures/fake-valheim && go build -trimpath -o ../bin/linux-amd64/fake-valheim .",
  "cd test/fixtures/raknet-pong && go build -trimpath -o ../bin/linux-amd64/raknet-pong .",
]
