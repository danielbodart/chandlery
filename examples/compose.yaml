# A working starting point for running Chandlery images.
#
# Deliberately absent: any Tidewaiter configuration. Auto-update policy belongs
# to whoever is deploying, and Tidewaiter documents its own labels and defaults
# far better than a copy here that would drift.
#
#   docker compose up -d
#   docker compose logs -f bedrock
#   docker exec chandlery-bedrock chandlery-console say hello

name: chandlery

services:
  bedrock:
    # The tag is the version. Pin it to control exactly when you move, or track
    # :latest and let a deployer swap you forward when the server is empty.
    image: ghcr.io/danielbodart/chandlery/bedrock:latest
    container_name: chandlery-bedrock
    restart: unless-stopped

    # The whole point of the stop hook is that the world is saved before the
    # process exits. Give a large world time to finish; Docker sends SIGKILL
    # when this runs out, and that is the outcome to avoid.
    stop_grace_period: 5m

    ports:
      - "19132:19132/udp"

    volumes:
      # A named volume inherits the right ownership from the image. A bind
      # mount does not — chown it to 1000:1000 on the host first, or the
      # container will tell you so and refuse to start.
      - bedrock-data:/data

    networks:
      - games

  valheim:
    image: ghcr.io/danielbodart/chandlery/valheim:latest
    container_name: chandlery-valheim
    restart: unless-stopped

    # Valheim writes the world on shutdown, and large worlds are not quick.
    stop_grace_period: 5m

    environment:
      # The one required setting, and the only environment variable this image
      # reads — it is a secret, so keep it in a .env file next to this one.
      VALHEIM_PASSWORD: ${VALHEIM_PASSWORD:?set VALHEIM_PASSWORD in .env}

    # Everything else is a native server flag. The image already defaults
    # -name/-world/-port/-public; override them, or add any other flag, here.
    # `command:` replaces the whole default set, so it names the wrapper first
    # and restates the flags you want to keep. Drop this line to take the
    # defaults as-is. (The Steam account that licenses Valheim is a *build*
    # credential, baked in at build time — nothing to supply at run time.)
    command: ["valheim-server", "-name", "Chandlery", "-world", "Dedicated", "-public", "1"]

    ports:
      - "2456:2456/udp"
      # The Steam query port (game port + 1), where the health check looks.
      # Valheim derives it from the game port and will not let you set it apart.
      - "2457:2457/udp"

    volumes:
      - valheim-data:/data

    networks:
      - games

networks:
  games:
    # Nothing special needed. Bedrock opens an IPv6 socket, but any ordinary
    # kernel provides one; you only hit trouble on a host booted with
    # ipv6.disable=1, which no compose setting can work around.
    {}

volumes:
  bedrock-data:
  valheim-data:
